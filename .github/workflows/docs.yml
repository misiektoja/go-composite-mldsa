# Builds the documentation site when its sources change and publishes it from the default branch.
#
# The site is served from the `gh-pages` branch. Every push and pull request that touches the
# documentation runs the strict build, so a broken link or a page missing from the navigation is
# reported before it reaches the default branch. Only the default branch publishes.
#
# The build job installs the MkDocs toolchain from PyPI and runs it, so it holds a read-only token.
# The publish job holds the only write token and runs no third-party code: it receives the built
# site as an artifact of the same run and pushes it with git alone.
name: Documentation

on:
  push:
    branches: [dev, main]
    paths:
      - docs/**
      - mkdocs.yml
      - Makefile
      - .github/workflows/docs.yml
  pull_request:
    branches: [dev, main]
    paths:
      - docs/**
      - mkdocs.yml
      - Makefile
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    permissions:
      contents: read
    name: Strict site build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Every package, including the transitive ones, is pinned by version and hash in
      # docs/requirements.txt, so a changed upstream file fails the install instead of running.
      - name: Install the documentation dependencies
        run: make docs-deps

      - name: Build the documentation
        run: make docs-build

      # Only a run that will publish keeps the site. A pull request stops at the strict build.
      - name: Keep the built site for the publish job
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to GitHub Pages
    needs: docs
    # Only the default branch publishes. A pull request and a topic branch stop at the strict build.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Pushing the rendered site to the gh-pages branch.
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      # The site was built by the read-only job of this same run. Nothing from the repository and
      # nothing from PyPI runs here.
      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      # The token reaches git as an Authorization header set on the command line, the way
      # actions/checkout passes it, so it is never written into the remote URL or the repository
      # configuration of the published checkout.
      - name: Fetch the published branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Building the branch in a fresh directory handles the first run, where gh-pages does not
          # exist yet, through the same code path as an update.
          git init -q -b gh-pages published
          git -C published remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          if git -C published -c "http.https://github.com/.extraheader=${auth}" fetch -q --depth 1 origin gh-pages; then
            git -C published reset -q --hard FETCH_HEAD
            echo "gh-pages exists, replacing the site on it"
          else
            echo "gh-pages does not exist yet, publishing the site for the first time"
          fi

      - name: Replace the site
        run: |
          # `git rm` clears the previous site so a page deleted from `docs/` disappears from the
          # published site too.
          if [ -n "$(git -C published ls-files)" ]; then
            git -C published rm -r -q --ignore-unmatch -- .
          fi
          cp -R site/. published/
          # Pages would otherwise run the content through Jekyll, which drops files it does not expect.
          touch published/.nojekyll

      - name: Publish the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C published add -A
          if git -C published diff --quiet --cached; then
            echo "site already current, nothing to publish"
            exit 0
          fi
          git -C published \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish the documentation for ${GITHUB_SHA}"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -C published -c "http.https://github.com/.extraheader=${auth}" push origin gh-pages

      - name: Report the site URL
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY##*/}"
          echo "Published https://${owner}.github.io/${name}/" >> "$GITHUB_STEP_SUMMARY"
