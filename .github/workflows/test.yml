name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    name: Unit tests and test vectors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain follows go.mod rather than the newest stable release, so a Go release cannot
      # change what CI runs without a commit. The module has no dependencies and therefore no go.sum,
      # so the cache is keyed on go.mod.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      # go mod tidy rewrites tracked files, so running it without this check would let CI repair a
      # stale go.mod and report success on a tree that no longer matches the commit.
      - name: Verify the module files are tidy
        run: make tidy-check

      - name: Check formatting
        run: make fmt-check

      - name: Run the tests
        env:
          TEST_SCRATCH: ${{ runner.temp }}/tests
        run: make test

  fuzz:
    permissions:
      contents: read
    name: Bounded fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      # A short budget keeps the job mandatory. Longer runs remain a local task. The Makefile
      # disables input minimization because a worker still minimizing when the budget expires makes
      # Go fail the run with "context deadline exceeded" (golang/go#75804).
      - name: Fuzz the parsers and the verifier
        run: make fuzz FUZZ_TIME=30s
