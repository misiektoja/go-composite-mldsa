title = "go-composite-mldsa"

[extend]
useDefault = true

[[allowlists]]
description = "Paths that never enter the repository or that hold build output only"
paths = [
  # Ignored directories checked for tracked files by the gitleaks Make target.
  '''^local/''',
  '''^\.cache/''',
  # Downloaded tool binaries.
  '''^bin/''',
]

[[allowlists]]
description = "Published test vectors of draft-ietf-lamps-pq-composite-sigs-19, whose private keys are public test data"
paths = [
  '''^testdata/draft-19-testvectors\.json$''',
]
